<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="title desc">
  <title id="title">TinyIMX</title>
  <desc id="desc">High-concurrency messaging with a Linux C++ backend, native Qt desktop and local AI.</desc>
