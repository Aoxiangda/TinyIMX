    <text x="56" y="174" fill="#eef3ff" font-size="27" font-weight="600">Realtime messaging. Reliable delivery. Native experience.</text>
    <text x="57" y="211" fill="#adbfde" font-size="17">From Reactor networking to desktop collaboration and local AI.</text>
