    <radialGradient id="glow"><stop stop-color="#5787df" stop-opacity=".26"/><stop offset="1" stop-color="#5787df" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1280" height="340" rx="22" fill="url(#bg)"/>
  <ellipse cx="1130" cy="120" rx="300" ry="240" fill="url(#glow)"/>
  <g opacity=".2" stroke="#9cbcf1" stroke-width="1.5" fill="none">
