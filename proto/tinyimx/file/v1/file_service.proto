syntax = "proto3";

package tinyimx.file.v1;

import "tinyimx/common/v1/common.proto";

// FileService keeps metadata/control RPCs and the M18-B1 internal chunk-write
// contract. actor_user_id is trusted only when injected by an authenticated
// TinyIMX ingress; an Internet client must never be authoritative for it.
service FileService {
    rpc BeginUpload(BeginUploadRequest) returns (BeginUploadResponse);
    rpc GetUploadSession(GetUploadSessionRequest) returns (GetUploadSessionResponse);
    rpc CancelUpload(CancelUploadRequest) returns (CancelUploadResponse);
    rpc UploadChunk(UploadChunkRequest) returns (UploadChunkResponse);
    rpc GetUploadProgress(GetUploadProgressRequest) returns (GetUploadProgressResponse);
    rpc FinalizeUpload(FinalizeUploadRequest) returns (FinalizeUploadResponse);
    rpc GetDownloadInfo(GetDownloadInfoRequest) returns (GetDownloadInfoResponse);
    rpc ReadFileRange(ReadFileRangeRequest) returns (ReadFileRangeResponse);
}

enum FileStatus {
    FILE_STATUS_UNSPECIFIED = 0;
    FILE_STATUS_UPLOADING = 1;
    FILE_STATUS_VERIFYING = 2;
    FILE_STATUS_AVAILABLE = 3;
    FILE_STATUS_FAILED = 4;
    FILE_STATUS_CANCELED = 5;
    FILE_STATUS_EXPIRED = 6;
    FILE_STATUS_DELETED = 7;
}

enum UploadSessionStatus {
    UPLOAD_SESSION_STATUS_UNSPECIFIED = 0;
    UPLOAD_SESSION_STATUS_ACTIVE = 1;
    UPLOAD_SESSION_STATUS_FINALIZING = 2;
    UPLOAD_SESSION_STATUS_COMPLETED = 3;
    UPLOAD_SESSION_STATUS_CANCELED = 4;
    UPLOAD_SESSION_STATUS_EXPIRED = 5;
}

enum UploadChunkStatus {
    UPLOAD_CHUNK_STATUS_UNSPECIFIED = 0;
    UPLOAD_CHUNK_STATUS_RESERVED = 1;
    UPLOAD_CHUNK_STATUS_STORED = 2;
}

enum BeginUploadResult {
    BEGIN_UPLOAD_RESULT_UNSPECIFIED = 0;
    BEGIN_UPLOAD_RESULT_CREATED = 1;
    BEGIN_UPLOAD_RESULT_REUSED = 2;
    BEGIN_UPLOAD_RESULT_IDEMPOTENCY_CONFLICT = 3;
}

enum CancelUploadResult {
    CANCEL_UPLOAD_RESULT_UNSPECIFIED = 0;
    CANCEL_UPLOAD_RESULT_APPLIED = 1;
    CANCEL_UPLOAD_RESULT_REUSED = 2;
}

enum UploadChunkResult {
    UPLOAD_CHUNK_RESULT_UNSPECIFIED = 0;
    UPLOAD_CHUNK_RESULT_STORED = 1;
    UPLOAD_CHUNK_RESULT_REUSED = 2;
    UPLOAD_CHUNK_RESULT_IDEMPOTENCY_CONFLICT = 3;
}

enum FinalizeUploadResult {
    FINALIZE_UPLOAD_RESULT_UNSPECIFIED = 0;
    FINALIZE_UPLOAD_RESULT_COMPLETED = 1;
    FINALIZE_UPLOAD_RESULT_REUSED = 2;
    FINALIZE_UPLOAD_RESULT_NOT_READY = 3;
    FINALIZE_UPLOAD_RESULT_CHECKSUM_MISMATCH = 4;
}

message FileRecord {
    uint64 file_id = 1;
    uint64 owner_user_id = 2;
    string file_name = 3;
    string content_type = 4;
    uint64 total_size = 5;
    string checksum_algorithm = 6;
    string expected_checksum = 7;
    string verified_checksum = 8;
    string storage_backend = 9;
    string storage_key = 10;
    FileStatus status = 11;
    uint64 version = 12;
    string created_at = 13;
    string updated_at = 14;
    string available_at = 15;
    string expires_at = 16;
}

message UploadSessionRecord {
    uint64 upload_id = 1;
    uint64 file_id = 2;
    uint64 owner_user_id = 3;
    string client_upload_id = 4;
    uint64 total_size = 5;
    uint64 chunk_size = 6;
    UploadSessionStatus status = 7;
    uint64 version = 8;
    string created_at = 9;
    string updated_at = 10;
    string expires_at = 11;
    string completed_at = 12;
}

message UploadChunkRecord {
    uint64 upload_id = 1;
    uint64 chunk_index = 2;
    uint64 file_id = 3;
    uint64 owner_user_id = 4;
    uint64 byte_offset = 5;
    uint64 chunk_size = 6;
    string checksum_algorithm = 7;
    string checksum = 8;
    string storage_part_key = 9;
    UploadChunkStatus status = 10;
    uint64 version = 11;
    string created_at = 12;
    string updated_at = 13;
    string stored_at = 14;
}

message BeginUploadRequest {
    tinyimx.common.v1.RequestMeta meta = 1;
    uint64 actor_user_id = 2;
    string client_upload_id = 3;
    string file_name = 4;
    string content_type = 5;
    uint64 total_size = 6;
    string checksum_algorithm = 7;
    string expected_checksum = 8;
    uint64 preferred_chunk_size = 9;
}

message BeginUploadResponse {
    BeginUploadResult result = 1;
    FileRecord file = 2;
    UploadSessionRecord session = 3;
    string message = 4;
}

message GetUploadSessionRequest {
    tinyimx.common.v1.RequestMeta meta = 1;
    uint64 actor_user_id = 2;
    uint64 upload_id = 3;
}

message GetUploadSessionResponse {
    FileRecord file = 1;
    UploadSessionRecord session = 2;
}

message CancelUploadRequest {
    tinyimx.common.v1.RequestMeta meta = 1;
    uint64 actor_user_id = 2;
    uint64 upload_id = 3;
}

message CancelUploadResponse {
    CancelUploadResult result = 1;
    FileRecord file = 2;
    UploadSessionRecord session = 3;
    string message = 4;
}

// chunk_index is zero-based. byte_offset and data length are checked against
// the durable session chunk_size/total_size, so out-of-order writes are safe
// while overlaps/gaps cannot redefine durable chunk identity.
message UploadChunkRequest {
    tinyimx.common.v1.RequestMeta meta = 1;
    uint64 actor_user_id = 2;
    uint64 upload_id = 3;
    uint64 chunk_index = 4;
    uint64 byte_offset = 5;
    bytes data = 6;
    string checksum_algorithm = 7;
    string checksum = 8;
}

message UploadChunkResponse {
    UploadChunkResult result = 1;
    UploadChunkRecord chunk = 2;
    string message = 3;
}


message ChunkIndexRange {
    uint64 start_index = 1;
    uint64 end_index = 2;
}

message UploadProgressRecord {
    uint64 expected_chunk_count = 1;
    uint64 stored_chunk_count = 2;
    uint64 reserved_chunk_count = 3;
    repeated ChunkIndexRange missing_ranges = 4;
    bool ready_to_finalize = 5;
}

message GetUploadProgressRequest {
    tinyimx.common.v1.RequestMeta meta = 1;
    uint64 actor_user_id = 2;
    uint64 upload_id = 3;
}

message GetUploadProgressResponse {
    FileRecord file = 1;
    UploadSessionRecord session = 2;
    UploadProgressRecord progress = 3;
    string message = 4;
}

message FinalizeUploadRequest {
    tinyimx.common.v1.RequestMeta meta = 1;
    uint64 actor_user_id = 2;
    uint64 upload_id = 3;
}

message FinalizeUploadResponse {
    FinalizeUploadResult result = 1;
    FileRecord file = 2;
    UploadSessionRecord session = 3;
    UploadProgressRecord progress = 4;
    string verified_checksum = 5;
    string message = 6;
}


message DownloadInfoRecord {
    uint64 file_id = 1;
    string file_name = 2;
    string content_type = 3;
    uint64 total_size = 4;
    string checksum_algorithm = 5;
    string verified_checksum = 6;
    uint64 version = 7;
    string available_at = 8;
}

message GetDownloadInfoRequest {
    tinyimx.common.v1.RequestMeta meta = 1;
    uint64 actor_user_id = 2;
    uint64 file_id = 3;
}

message GetDownloadInfoResponse {
    DownloadInfoRecord info = 1;
    string message = 2;
}

// ReadFileRange is intentionally bounded and stateless. The caller resumes
// by issuing the next offset after reconnect. if_match_sha256 is an optional
// strong validator bound to the immutable AVAILABLE object.
message ReadFileRangeRequest {
    tinyimx.common.v1.RequestMeta meta = 1;
    uint64 actor_user_id = 2;
    uint64 file_id = 3;
    uint64 offset = 4;
    uint64 length = 5;
    string if_match_sha256 = 6;
}

message ReadFileRangeResponse {
    DownloadInfoRecord info = 1;
    uint64 offset = 2;
    bytes data = 3;
    string range_sha256 = 4;
    bool eof = 5;
    uint64 next_offset = 6;
    string message = 7;
}
