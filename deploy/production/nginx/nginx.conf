worker_processes auto;
worker_rlimit_nofile 262144;
error_log /var/log/nginx/error.log info;
pid /var/run/nginx.pid;
events { worker_connections 131072; multi_accept on; }
stream {
    log_format tinyimx_stream '$remote_addr [$time_local] $protocol $status $bytes_sent $bytes_received $session_time $upstream_addr $upstream_connect_time';
    access_log /var/log/nginx/stream-access.log tinyimx_stream;
    upstream tinyimx_gateway_cluster {
        zone tinyimx_gateway_cluster 64k;

        resolver 127.0.0.11 valid=5s ipv6=off;
        resolver_timeout 1s;

        least_conn;

        server gateway-a.tinyimx.invalid:9000 resolve max_fails=3 fail_timeout=5s;
        server gateway-b.tinyimx.invalid:9000 resolve max_fails=3 fail_timeout=5s;
    }
    server {
        listen 9000 backlog=16384;
        proxy_connect_timeout 2s;
        proxy_timeout 120s;
        proxy_pass tinyimx_gateway_cluster;
    }
    server {
        listen 9443 ssl backlog=16384;
        ssl_certificate /etc/nginx/tls/tinyimx.crt;
        ssl_certificate_key /etc/nginx/tls/tinyimx.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TinyIMXSSL:10m;
        ssl_session_timeout 10m;
        proxy_connect_timeout 2s;
        proxy_timeout 120s;
        proxy_pass tinyimx_gateway_cluster;
    }
}
http {
    access_log off;
    server_tokens off;
    server {
        listen 8080;
        location = /healthz { default_type text/plain; return 200 "ok\n"; }
    }
}
